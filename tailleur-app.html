<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon Atelier</title>
<style>
:root{
  --indigo:#1F3A5F; --indigo-dk:#152943; --gold:#D4A017; --gold-dk:#B4870F;
  --cream:#FBF7EF; --card:#FFFFFF; --ink:#1A1A1A; --ink-soft:#5B6472;
  --line:#E8E1D4; --green:#3A7D44; --coral:#C1502E; --blue-soft:#EDF2F8;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--cream); color:var(--ink); height:100%;
  display:flex; flex-direction:column; overflow:hidden;
}
#app{display:flex; flex-direction:column; height:100%; max-width:480px; margin:0 auto; width:100%; position:relative;}
header{
  background:var(--indigo); color:#fff; padding:18px 20px 16px;
  padding-top:calc(18px + env(safe-area-inset-top,0px));
  display:flex; align-items:center; gap:12px; flex-shrink:0;
}
header .back{
  width:36px; height:36px; border-radius:10px; background:rgba(255,255,255,.14);
  display:flex; align-items:center; justify-content:center; font-size:20px; cursor:pointer; border:none; color:#fff; flex-shrink:0;
}
header h1{font-size:20px; font-weight:700; flex:1; letter-spacing:.2px;}
header .sub{font-size:13px; opacity:.75; margin-top:2px; font-weight:400;}
main{flex:1; overflow-y:auto; padding:16px 16px 90px; -webkit-overflow-scrolling:touch;}
nav.tabbar{
  position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px;
  background:#fff; border-top:1px solid var(--line); display:flex;
  padding-bottom:env(safe-area-inset-bottom,0px); z-index:20; flex-shrink:0;
}
nav.tabbar button{
  flex:1; background:none; border:none; padding:9px 2px 8px; display:flex; flex-direction:column;
  align-items:center; gap:3px; color:var(--ink-soft); font-size:11px; font-weight:600; cursor:pointer;
}
nav.tabbar button svg{width:24px; height:24px;}
nav.tabbar button.active{color:var(--indigo);}
nav.tabbar button.active svg{filter:none;}

.greet{font-size:24px; font-weight:800; margin-bottom:2px;}
.greet-sub{color:var(--ink-soft); font-size:14px; margin-bottom:18px;}
.stats{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:22px;}
.stat-card{background:var(--card); border-radius:16px; padding:14px; border:1px solid var(--line);}
.stat-card .n{font-size:26px; font-weight:800; color:var(--indigo);}
.stat-card.pay .n{color:var(--coral); font-size:19px;}
.stat-card .l{font-size:12px; color:var(--ink-soft); margin-top:2px; font-weight:600;}
.tiles{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.tile{
  background:var(--card); border:1px solid var(--line); border-radius:18px; padding:20px 14px;
  display:flex; flex-direction:column; align-items:flex-start; gap:10px; cursor:pointer;
  transition:transform .1s;
}
.tile:active{transform:scale(.96);}
.tile .ic{width:46px; height:46px; border-radius:12px; display:flex; align-items:center; justify-content:center;}
.tile .ic svg{width:26px; height:26px;}
.tile span{font-weight:700; font-size:15px;}
.tile.c1 .ic{background:#EDE3F5;} .tile.c1 .ic svg{color:#6B3FA0;}
.tile.c2 .ic{background:var(--blue-soft);} .tile.c2 .ic svg{color:var(--indigo);}
.tile.c3 .ic{background:#FBEADF;} .tile.c3 .ic svg{color:var(--gold-dk);}
.tile.c4 .ic{background:#E4F0E5;} .tile.c4 .ic svg{color:var(--green);}

.search{
  display:flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--line);
  border-radius:14px; padding:11px 14px; margin-bottom:14px;
}
.search svg{width:19px; height:19px; color:var(--ink-soft); flex-shrink:0;}
.search input{border:none; outline:none; flex:1; font-size:15px; background:none; color:var(--ink);}

.fab{
  position:fixed; bottom:76px; right:calc(50% - 240px + 20px); background:var(--gold); color:#1A1A1A;
  border:none; border-radius:16px; padding:14px 20px; font-size:15px; font-weight:800;
  display:flex; align-items:center; gap:8px; box-shadow:0 6px 16px rgba(212,160,23,.4); cursor:pointer; z-index:15;
}
@media(max-width:480px){ .fab{right:20px;} }
.fab svg{width:18px; height:18px;}

.list-item{
  background:#fff; border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:10px;
  display:flex; gap:12px; align-items:center; cursor:pointer;
}
.avatar{
  width:48px; height:48px; border-radius:12px; background:var(--blue-soft); flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-weight:800; color:var(--indigo);
  font-size:17px; overflow:hidden;
}
.avatar img{width:100%; height:100%; object-fit:cover;}
.li-body{flex:1; min-width:0;}
.li-title{font-weight:700; font-size:15.5px;}
.li-sub{font-size:13px; color:var(--ink-soft); margin-top:2px;}
.chev{color:var(--ink-soft); font-size:20px; flex-shrink:0;}
.badge{
  font-size:11px; font-weight:700; padding:4px 9px; border-radius:20px; flex-shrink:0;
}
.badge.attente{background:#F3EAE0; color:var(--gold-dk);}
.badge.cours{background:var(--blue-soft); color:var(--indigo);}
.badge.termine{background:#E4F0E5; color:var(--green);}
.badge.livree{background:#EAEAEA; color:#555;}

.empty{
  text-align:center; padding:60px 20px; color:var(--ink-soft);
}
.empty .ic{font-size:44px; margin-bottom:10px;}
.empty p{font-size:14.5px; line-height:1.5;}

.section-title{font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.5px; color:var(--ink-soft); margin:18px 0 10px;}
.section-title:first-child{margin-top:0;}

form{display:flex; flex-direction:column; gap:14px;}
.field label{display:block; font-size:13px; font-weight:700; color:var(--ink-soft); margin-bottom:6px;}
.field input[type=text], .field input[type=tel], .field input[type=number], .field input[type=date], .field select, .field textarea{
  width:100%; border:1.5px solid var(--line); border-radius:12px; padding:13px 14px; font-size:15.5px;
  background:#fff; color:var(--ink); outline:none; font-family:inherit;
}
.field textarea{resize:vertical; min-height:70px;}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--indigo);}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.photo-pick{
  border:2px dashed var(--line); border-radius:16px; padding:18px; text-align:center; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:8px; color:var(--ink-soft); font-size:13.5px; font-weight:600;
  position:relative; overflow:hidden; min-height:90px; justify-content:center;
}
.photo-pick img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
.photo-pick svg{width:26px; height:26px;}
.seg{display:flex; background:var(--blue-soft); border-radius:12px; padding:4px; gap:4px;}
.seg button{
  flex:1; border:none; background:none; padding:10px 4px; border-radius:9px; font-weight:700; font-size:13.5px;
  color:var(--ink-soft); cursor:pointer;
}
.seg button.on{background:#fff; color:var(--indigo); box-shadow:0 1px 3px rgba(0,0,0,.08);}
.btn-primary{
  background:var(--indigo); color:#fff; border:none; border-radius:14px; padding:16px; font-size:16px; font-weight:800;
  cursor:pointer; margin-top:6px;
}
.btn-primary:active{background:var(--indigo-dk);}
.btn-danger{
  background:none; color:var(--coral); border:1.5px solid #F0D9CF; border-radius:14px; padding:14px; font-size:14.5px; font-weight:700;
  cursor:pointer;
}

.detail-card{background:#fff; border:1px solid var(--line); border-radius:18px; padding:18px; margin-bottom:14px;}
.detail-head{display:flex; align-items:center; gap:14px; margin-bottom:4px;}
.detail-head .avatar{width:60px; height:60px; font-size:20px;}
.detail-head .name{font-size:19px; font-weight:800;}
.detail-head .phone{font-size:13.5px; color:var(--ink-soft); margin-top:2px;}
.call-btn{
  margin-left:auto; background:var(--blue-soft); color:var(--indigo); border:none; width:40px; height:40px;
  border-radius:11px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
}
.call-btn svg{width:19px; height:19px;}
.row-mini{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); font-size:14.5px;}
.row-mini:last-child{border-bottom:none;}
.row-mini .k{color:var(--ink-soft);}
.row-mini .v{font-weight:700;}
.meas-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px 16px; margin-top:6px;}
.meas-grid .m{display:flex; justify-content:space-between; font-size:14px; padding:7px 0; border-bottom:1px solid var(--line);}
.meas-grid .m .k{color:var(--ink-soft);}
.meas-grid .m .v{font-weight:700;}
.mini-tag{font-size:11.5px; color:var(--ink-soft); font-weight:700; margin-bottom:8px;}
.action-row{display:flex; gap:10px; margin-top:14px;}
.action-row button{flex:1;}
.btn-outline{
  background:none; border:1.5px solid var(--line); border-radius:12px; padding:12px; font-size:14px; font-weight:700;
  color:var(--indigo); cursor:pointer;
}
.model-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.model-card{background:#fff; border:1px solid var(--line); border-radius:16px; overflow:hidden; cursor:pointer;}
.model-card .ph{width:100%; height:110px; background:var(--blue-soft); display:flex; align-items:center; justify-content:center; color:var(--indigo);}
.model-card .ph img{width:100%; height:100%; object-fit:cover;}
.model-card .info{padding:10px 12px 12px;}
.model-card .mn{font-weight:700; font-size:14px;}
.model-card .mc{font-size:12px; color:var(--ink-soft); margin-top:2px;}
.toast{
  position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff;
  padding:12px 20px; border-radius:30px; font-size:14px; font-weight:600; z-index:40; opacity:0; transition:opacity .25s, bottom .25s;
  pointer-events:none; white-space:nowrap;
}
.toast.show{opacity:1; bottom:110px;}
.hidden{display:none !important;}
.filter-chips{display:flex; gap:8px; margin-bottom:14px; overflow-x:auto; padding-bottom:2px;}
.filter-chips button{
  border:1.5px solid var(--line); background:#fff; border-radius:20px; padding:8px 14px; font-size:13px; font-weight:700;
  color:var(--ink-soft); white-space:nowrap; cursor:pointer; flex-shrink:0;
}
.filter-chips button.on{background:var(--indigo); border-color:var(--indigo); color:#fff;}
</style>
</head>
<body>
<div id="app">
  <header id="hdr">
    <h1 id="hdrTitle">Bonjour 👋</h1>
  </header>
  <main id="main"></main>
  <div id="fabSlot"></div>
  <nav class="tabbar">
    <button data-tab="home" onclick="go('home')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      Accueil
    </button>
    <button data-tab="mesures" onclick="go('mesures')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h16M4 16h16" stroke-linecap="round"/><path d="M6 4v16M18 4v16" stroke-linecap="round"/></svg>
      Mesures
    </button>
    <button data-tab="clients" onclick="go('clients')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
      Clients
    </button>
    <button data-tab="commandes" onclick="go('commandes')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="6" width="16" height="15" rx="2"/><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
      Commandes
    </button>
    <button data-tab="modeles" onclick="go('modeles')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3l4 3 4-3 3 4-3 2v11H5V9L2 7l3-4"/></svg>
      Modèles
    </button>
  </nav>
</div>
<div class="toast" id="toast"></div>

<script>
/* ---------- Stockage ---------- */
const KEY='atelier_v1';
function load(){ try{return JSON.parse(localStorage.getItem(KEY))||{clients:[],mesures:[],commandes:[],modeles:[]};}catch(e){return {clients:[],mesures:[],commandes:[],modeles:[]};} }
function save(){ try{localStorage.setItem(KEY, JSON.stringify(DB));}catch(e){ toast("Stockage plein — supprimez une photo."); } }
let DB = load();
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1800); }
function fmt(n){ return (Math.round(n||0)).toLocaleString('fr-FR'); }
function fmtDate(d){ if(!d) return '—'; const dt=new Date(d+"T00:00:00"); if(isNaN(dt)) return d; return dt.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'}); }
function initials(n){ return (n||'?').trim().split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }

/* ---------- Navigation ---------- */
let state = { tab:'home', view:'list', editId:null, clientFilter:null };
function go(tab){ state={tab, view:'list', editId:null, clientFilter: tab==='mesures'?state.clientFilter:null}; render(); }
function setHeader(title, back){
  document.getElementById('hdrTitle').textContent=title;
  const h=document.getElementById('hdr');
  h.innerHTML = (back?'<button class="back" onclick="'+back+'">‹</button>':'') + '<h1>'+title+'</h1>';
}
function markTab(){
  document.querySelectorAll('.tabbar button').forEach(b=>b.classList.toggle('active', b.dataset.tab===state.tab));
}
function setFab(html){ document.getElementById('fabSlot').innerHTML = html||''; }

const ICON_ADD='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>';
const ICON_SEARCH='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3" stroke-linecap="round"/></svg>';
const ICON_CALL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3 19.5 19.5 0 01-6-6 19.8 19.8 0 01-3-8.7A2 2 0 014.1 2h3a2 2 0 012 1.7c.1 1 .3 2 .7 3a2 2 0 01-.4 2.1L8 10.3a16 16 0 006 6l1.5-1.5a2 2 0 012.1-.4c1 .4 2 .6 3 .7a2 2 0 011.7 2z"/></svg>';

function render(){
  markTab();
  if(state.tab==='home') return renderHome();
  if(state.tab==='clients') return renderClients();
  if(state.tab==='mesures') return renderMesures();
  if(state.tab==='commandes') return renderCommandes();
  if(state.tab==='modeles') return renderModeles();
}

/* ---------- ACCUEIL ---------- */
function renderHome(){
  setHeader('Bonjour 👋'); setFab('');
  const enCours = DB.commandes.filter(c=>c.statut==='cours').length;
  const aLivrer = DB.commandes.filter(c=>c.statut==='termine').length;
  const enAttente = DB.commandes.reduce((s,c)=> s + Math.max(0,(c.prix||0)-(c.avance||0)), 0);
  document.getElementById('main').innerHTML = `
    <div class="greet-sub">Voici votre atelier aujourd'hui</div>
    <div class="stats">
      <div class="stat-card"><div class="n">${enCours}</div><div class="l">Commandes en cours</div></div>
      <div class="stat-card"><div class="n">${aLivrer}</div><div class="l">Prêtes à livrer</div></div>
      <div class="stat-card pay" style="grid-column:1/3"><div class="n">${fmt(enAttente)} FCFA</div><div class="l">Paiements en attente</div></div>
    </div>
    <div class="section-title">Menu principal</div>
    <div class="tiles">
      <div class="tile c1" onclick="go('mesures')"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h16M4 16h16" stroke-linecap="round"/><path d="M6 4v16M18 4v16" stroke-linecap="round"/></svg></div><span>Mesures</span></div>
      <div class="tile c2" onclick="go('clients')"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg></div><span>Clients</span></div>
      <div class="tile c3" onclick="go('commandes')"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="6" width="16" height="15" rx="2"/><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg></div><span>Commandes</span></div>
      <div class="tile c4" onclick="go('modeles')"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3l4 3 4-3 3 4-3 2v11H5V9L2 7l3-4"/></svg></div><span>Modèles</span></div>
    </div>
  `;
}

/* ---------- CLIENTS ---------- */
function renderClients(){
  if(state.view==='form') return renderClientForm();
  if(state.view==='detail') return renderClientDetail(state.editId);
  setHeader('Clients');
  setFab(`<button class="fab" onclick="state.view='form'; state.editId=null; render();">${ICON_ADD} Ajouter</button>`);
  const q=(state.q||'').toLowerCase();
  let list = DB.clients.filter(c=> !q || c.nom.toLowerCase().includes(q) || (c.tel||'').includes(q));
  let html = `<div class="search">${ICON_SEARCH}<input placeholder="Rechercher un client..." value="${state.q||''}" oninput="state.q=this.value; renderClients();"></div>`;
  if(list.length===0){
    html += `<div class="empty"><div class="ic">👤</div><p>${DB.clients.length? "Aucun client trouvé." : "Aucun client pour le moment.<br>Appuyez sur Ajouter pour commencer."}</p></div>`;
  } else {
    list.slice().reverse().forEach(c=>{
      const nbCmd = DB.commandes.filter(o=>o.clientId===c.id).length;
      html += `<div class="list-item" onclick="state.view='detail'; state.editId='${c.id}'; render();">
        <div class="avatar">${c.photo?`<img src="${c.photo}">`:initials(c.nom)}</div>
        <div class="li-body"><div class="li-title">${esc(c.nom)}</div><div class="li-sub">${c.tel||'Pas de numéro'} · ${nbCmd} commande${nbCmd>1?'s':''}</div></div>
        <div class="chev">›</div>
      </div>`;
    });
  }
  document.getElementById('main').innerHTML = html;
}
function renderClientForm(){
  const c = state.editId ? DB.clients.find(x=>x.id===state.editId) : null;
  setHeader(c?'Modifier le client':'Nouveau client', "state.view='list'; render();");
  setFab('');
  document.getElementById('main').innerHTML = `
    <form onsubmit="return saveClient(event)">
      <div class="photo-pick" id="photoPick" onclick="document.getElementById('photoInput').click()">
        ${c&&c.photo?`<img src="${c.photo}">`:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="4"/><path d="M8 6l1.5-2h5L16 6"/></svg><span>Ajouter une photo (optionnel)</span>`}
      </div>
      <input type="file" id="photoInput" accept="image/*" style="display:none" onchange="pickPhoto(this,'photoPick')">
      <div class="field"><label>Nom et prénom</label><input type="text" id="f_nom" value="${c?esc(c.nom):''}" placeholder="Ex : Awa Diop" required></div>
      <div class="field"><label>Numéro de téléphone</label><input type="tel" id="f_tel" value="${c?c.tel||'':''}" placeholder="Ex : 77 123 45 67"></div>
      <button class="btn-primary" type="submit">Enregistrer</button>
      ${c?`<button type="button" class="btn-danger" onclick="delClient('${c.id}')">Supprimer ce client</button>`:''}
    </form>
  `;
}
function pickPhoto(input, targetId){
  const f=input.files[0]; if(!f) return;
  const reader=new FileReader();
  reader.onload=()=>{ document.getElementById(targetId).innerHTML=`<img src="${reader.result}">`; document.getElementById(targetId).dataset.photo=reader.result; };
  reader.readAsDataURL(f);
}
function saveClient(ev){
  ev.preventDefault();
  const nom=document.getElementById('f_nom').value.trim();
  const tel=document.getElementById('f_tel').value.trim();
  const photo=document.getElementById('photoPick').dataset.photo || (state.editId ? (DB.clients.find(x=>x.id===state.editId)||{}).photo : null);
  if(!nom){ return false; }
  if(state.editId){
    const c=DB.clients.find(x=>x.id===state.editId); c.nom=nom; c.tel=tel; if(photo) c.photo=photo;
  } else {
    DB.clients.push({id:uid(), nom, tel, photo:photo||null, createdAt:Date.now()});
  }
  save(); toast('Client enregistré'); state.view='list'; state.editId=null; render();
  return false;
}
function delClient(id){
  if(!confirm('Supprimer ce client et toutes ses données liées ?')) return;
  DB.clients=DB.clients.filter(c=>c.id!==id);
  DB.mesures=DB.mesures.filter(m=>m.clientId!==id);
  DB.commandes=DB.commandes.filter(o=>o.clientId!==id);
  save(); toast('Client supprimé'); state.view='list'; render();
}
function renderClientDetail(id){
  const c=DB.clients.find(x=>x.id===id);
  if(!c){ state.view='list'; return render(); }
  setHeader('Fiche client', "state.tab='clients'; state.view='list'; render();");
  setFab('');
  const mesures = DB.mesures.filter(m=>m.clientId===id).sort((a,b)=>b.date.localeCompare(a.date));
  const commandes = DB.commandes.filter(o=>o.clientId===id).sort((a,b)=>b.dateCommande.localeCompare(a.dateCommande));
  let mHtml = mesures.length ? mesures.slice(0,1).map(m=>measBlock(m)).join('') : `<div class="empty" style="padding:24px 10px"><p>Aucune mesure enregistrée.</p></div>`;
  let cHtml = commandes.length ? commandes.map(o=>orderRow(o)).join('') : `<div class="empty" style="padding:24px 10px"><p>Aucune commande.</p></div>`;
  document.getElementById('main').innerHTML = `
    <div class="detail-card">
      <div class="detail-head">
        <div class="avatar">${c.photo?`<img src="${c.photo}">`:initials(c.nom)}</div>
        <div><div class="name">${esc(c.nom)}</div><div class="phone">${c.tel||'Pas de numéro'}</div></div>
        ${c.tel?`<a class="call-btn" href="tel:${c.tel}">${ICON_CALL}</a>`:''}
      </div>
      <div class="action-row">
        <button class="btn-outline" onclick="state.view='form'; render();">Modifier</button>
        <button class="btn-outline" onclick="state.tab='mesures'; state.clientFilter='${c.id}'; state.view='form'; state.editId=null; render();">+ Mesure</button>
        <button class="btn-outline" onclick="newOrderForClient('${c.id}')">+ Commande</button>
      </div>
    </div>
    <div class="section-title">Dernières mesures</div>
    ${mHtml}
    <div class="section-title">Commandes</div>
    ${cHtml}
  `;
}
function newOrderForClient(clientId){ state.tab='commandes'; state.view='form'; state.editId=null; state.newForClient=clientId; render(); }
function esc(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------- MESURES ---------- */
const MEAS_GROUPS = [
  ['Haut du corps', [
    ['tourCou','Tour de cou'],['carrure','Carrure (dos)'],['epaule','Long. d\u2019épaule'],
    ['poitrine','Tour de poitrine'],['tourTaille','Tour de taille'],['tourBassin','Tour de bassin']
  ]],
  ['Bras', [
    ['longueurMancheLongue','Long. manche longue'],['longueurMancheCourte','Long. manche courte'],
    ['tourBras','Tour de bras'],['tourPoignet','Tour de poignet']
  ]],
  ['Longueurs tenue', [
    ['longueurBoubou','Long. boubou / robe'],['longueurChemise','Long. chemise'],['longueurVeste','Long. veste']
  ]],
  ['Bas du corps', [
    ['longueurPantalon','Long. pantalon'],['tourCuisse','Tour de cuisse'],['tourGenou','Tour de genou'],['tourMollet','Tour de mollet']
  ]],
];
const MEAS_FIELDS = MEAS_GROUPS.flatMap(g=>g[1]);
function measBlock(m){
  const c = DB.clients.find(x=>x.id===m.clientId);
  const groups = MEAS_GROUPS.map(g=>{
    const rows = g[1].filter(f=>m[f[0]]).map(f=>`<div class="m"><span class="k">${f[1]}</span><span class="v">${m[f[0]]} cm</span></div>`).join('');
    return rows ? `<div class="mini-tag" style="margin-top:12px">${g[0]}</div><div class="meas-grid">${rows}</div>` : '';
  }).join('');
  return `<div class="detail-card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <div class="name" style="font-size:16px">${esc(c?c.nom:'Client supprimé')}</div>
      <button class="btn-outline" style="padding:6px 12px; font-size:12.5px" onclick="editMeasure('${m.id}')">Modifier</button>
    </div>
    <div class="mini-tag" style="margin-top:2px">${fmtDate(m.date)}</div>
    ${groups || '<div class="meas-grid"><div class="m"><span class="k">Aucune valeur</span></div></div>'}
    ${m.notes?`<div class="row-mini" style="margin-top:6px"><span class="k">Notes</span><span class="v" style="text-align:right; max-width:60%">${esc(m.notes)}</span></div>`:''}
  </div>`;
}
function editMeasure(id){ state.view='form'; state.editId=id; render(); }
function renderMesures(){
  if(state.view==='form') return renderMeasureForm();
  setHeader('Mesures'); setFab('');
  if(!state.clientFilter){
    const q=(state.q||'').toLowerCase();
    let list = DB.clients.filter(c=> !q || c.nom.toLowerCase().includes(q));
    let html = `<div class="search">${ICON_SEARCH}<input placeholder="Choisir un client..." value="${state.q||''}" oninput="state.q=this.value; renderMesures();"></div>`;
    if(DB.clients.length===0){
      html += `<div class="empty"><div class="ic">📏</div><p>Ajoutez d'abord un client<br>pour enregistrer ses mesures.</p></div>`;
    } else if(list.length===0){
      html += `<div class="empty"><p>Aucun client trouvé.</p></div>`;
    } else {
      list.forEach(c=>{
        const n=DB.mesures.filter(m=>m.clientId===c.id).length;
        html += `<div class="list-item" onclick="state.clientFilter='${c.id}'; state.q=''; render();">
          <div class="avatar">${c.photo?`<img src="${c.photo}">`:initials(c.nom)}</div>
          <div class="li-body"><div class="li-title">${esc(c.nom)}</div><div class="li-sub">${n? n+' mesure'+(n>1?'s':'')+' enregistrée'+(n>1?'s':'') : 'Aucune mesure'}</div></div>
          <div class="chev">›</div>
        </div>`;
      });
    }
    document.getElementById('main').innerHTML = html;
    return;
  }
  const c = DB.clients.find(x=>x.id===state.clientFilter);
  if(!c){ state.clientFilter=null; return renderMesures(); }
  setHeader(esc(c.nom), "state.clientFilter=null; render();");
  setFab(`<button class="fab" onclick="state.view='form'; state.editId=null; render();">${ICON_ADD} Nouvelle mesure</button>`);
  const list = DB.mesures.filter(m=>m.clientId===c.id).sort((a,b)=>b.date.localeCompare(a.date));
  let html = `<div class="section-title">Historique (${list.length})</div>`;
  html += list.length ? list.map(measBlock).join('') : `<div class="empty"><div class="ic">📏</div><p>Aucune mesure pour ce client.<br>Appuyez sur "Nouvelle mesure".</p></div>`;
  document.getElementById('main').innerHTML = html;
}
function renderMeasureForm(){
  const m = state.editId ? DB.mesures.find(x=>x.id===state.editId) : null;
  const clientId = m ? m.clientId : state.clientFilter;
  const c = DB.clients.find(x=>x.id===clientId);
  setHeader(m?'Modifier la mesure':'Nouvelle mesure', "state.view='list'; render();");
  setFab('');
  const groupsHtml = MEAS_GROUPS.map(g=>`
    <div class="section-title">${g[0]}</div>
    <div class="grid2">${g[1].map(f=>`
      <div class="field"><label>${f[1]} (cm)</label><input type="number" step="0.5" min="0" id="mf_${f[0]}" value="${m&&m[f[0]]?m[f[0]]:''}"></div>
    `).join('')}</div>
  `).join('');
  document.getElementById('main').innerHTML = `
    <div class="detail-card" style="padding:14px 16px; display:flex; align-items:center; gap:12px; margin-bottom:16px;">
      <div class="avatar">${c&&c.photo?`<img src="${c.photo}">`:initials(c?c.nom:'')}</div>
      <div><div class="name" style="font-size:16px">${esc(c?c.nom:'')}</div><div class="phone">${c&&c.tel||''}</div></div>
    </div>
    <form onsubmit="return saveMeasure(event,'${clientId}')">
      <div class="field"><label>Date</label><input type="date" id="mf_date" value="${m?m.date:new Date().toISOString().slice(0,10)}" required></div>
      ${groupsHtml}
      <div class="field"><label>Notes</label><textarea id="mf_notes">${m&&m.notes?esc(m.notes):''}</textarea></div>
      <button class="btn-primary" type="submit">Enregistrer la mesure</button>
      ${m?`<button type="button" class="btn-danger" onclick="delMeasure('${m.id}')">Supprimer cette mesure</button>`:''}
    </form>
  `;
}
function saveMeasure(ev, clientId){
  ev.preventDefault();
  const data = {date: document.getElementById('mf_date').value, notes: document.getElementById('mf_notes').value.trim(), clientId};
  MEAS_FIELDS.forEach(f=>{ const v=document.getElementById('mf_'+f[0]).value; if(v) data[f[0]]=v; });
  if(state.editId){
    const idx = DB.mesures.findIndex(x=>x.id===state.editId);
    DB.mesures[idx] = {...DB.mesures[idx], ...data};
  } else {
    DB.mesures.push({id:uid(), ...data});
  }
  save(); toast('Mesure enregistrée'); state.view='list'; state.editId=null; render();
  return false;
}
function delMeasure(id){
  if(!confirm('Supprimer cette mesure ?')) return;
  DB.mesures = DB.mesures.filter(m=>m.id!==id);
  save(); toast('Mesure supprimée'); state.view='list'; render();
}

/* ---------- COMMANDES ---------- */
const STATUTS = [['attente','En attente'],['cours','En cours'],['termine','Terminée'],['livree','Livrée']];
function statutLabel(s){ return (STATUTS.find(x=>x[0]===s)||['','—'])[1]; }
function orderRow(o){
  const c = DB.clients.find(x=>x.id===o.clientId);
  const mod = DB.modeles.find(x=>x.id===o.modeleId);
  return `<div class="list-item" onclick="state.view='form'; state.editId='${o.id}'; render();">
    <div class="avatar">${o.photo?`<img src="${o.photo}">`: (mod&&mod.photo?`<img src="${mod.photo}">`:'🧵')}</div>
    <div class="li-body">
      <div class="li-title">${esc(c?c.nom:'Client supprimé')}${mod?' · '+esc(mod.nom):''}</div>
      <div class="li-sub">Livraison : ${fmtDate(o.dateLivraison)} · ${fmt(o.prix)} FCFA</div>
    </div>
    <div class="badge ${o.statut}">${statutLabel(o.statut)}</div>
  </div>`;
}
function renderCommandes(){
  if(state.view==='form') return renderOrderForm();
  setHeader('Commandes');
  setFab(`<button class="fab" onclick="state.view='form'; state.editId=null; render();">${ICON_ADD} Nouvelle</button>`);
  const f = state.orderFilter || 'toutes';
  let list = DB.commandes.slice().sort((a,b)=>b.dateCommande.localeCompare(a.dateCommande));
  if(f!=='toutes') list = list.filter(o=>o.statut===f);
  let chips = `<div class="filter-chips">
    <button class="${f==='toutes'?'on':''}" onclick="state.orderFilter='toutes'; renderCommandes();">Toutes</button>
    ${STATUTS.map(s=>`<button class="${f===s[0]?'on':''}" onclick="state.orderFilter='${s[0]}'; renderCommandes();">${s[1]}</button>`).join('')}
  </div>`;
  let html = chips;
  html += list.length ? list.map(orderRow).join('') : `<div class="empty"><div class="ic">🧵</div><p>Aucune commande ici.</p></div>`;
  document.getElementById('main').innerHTML = html;
}
function renderOrderForm(){
  const o = state.editId ? DB.commandes.find(x=>x.id===state.editId) : null;
  setHeader(o?'Modifier la commande':'Nouvelle commande', "state.view='list'; render();");
  setFab('');
  const preClient = o ? o.clientId : (state.newForClient||'');
  const clientOpts = DB.clients.map(c=>`<option value="${c.id}" ${preClient===c.id?'selected':''}>${esc(c.nom)}</option>`).join('');
  const modeleOpts = `<option value="">Aucun</option>` + DB.modeles.map(m=>`<option value="${m.id}" ${o&&o.modeleId===m.id?'selected':''}>${esc(m.nom)}</option>`).join('');
  if(DB.clients.length===0){
    document.getElementById('main').innerHTML = `<div class="empty"><div class="ic">👤</div><p>Ajoutez d'abord un client<br>avant de créer une commande.</p></div>`;
    return;
  }
  document.getElementById('main').innerHTML = `
    <form onsubmit="return saveOrder(event)">
      <div class="field"><label>Client</label><select id="of_client" required>${clientOpts}</select></div>
      <div class="field"><label>Modèle</label><select id="of_modele">${modeleOpts}</select></div>
      <div class="photo-pick" id="orderPhotoPick" onclick="document.getElementById('orderPhotoInput').click()">
        ${o&&o.photo?`<img src="${o.photo}">`:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="4"/></svg><span>Photo du modèle commandé (optionnel)</span>`}
      </div>
      <input type="file" id="orderPhotoInput" accept="image/*" style="display:none" onchange="pickPhoto(this,'orderPhotoPick')">
      <div class="grid2">
        <div class="field"><label>Date de commande</label><input type="date" id="of_dateC" value="${o?o.dateCommande:new Date().toISOString().slice(0,10)}" required></div>
        <div class="field"><label>Date de livraison</label><input type="date" id="of_dateL" value="${o?o.dateLivraison||'':''}"></div>
      </div>
      <div class="grid2">
        <div class="field"><label>Prix total (FCFA)</label><input type="number" min="0" id="of_prix" value="${o?o.prix||'':''}" oninput="updateReste()"></div>
        <div class="field"><label>Avance versée (FCFA)</label><input type="number" min="0" id="of_avance" value="${o?o.avance||'':''}" oninput="updateReste()"></div>
      </div>
      <div class="row-mini" style="background:var(--blue-soft); border-radius:12px; padding:12px 14px; border:none;">
        <span class="k">Reste à payer</span><span class="v" id="resteVal">${fmt((o?o.prix||0:0)-(o?o.avance||0:0))} FCFA</span>
      </div>
      <div class="field"><label>Statut</label>
        <div class="seg" id="statutSeg">
          ${STATUTS.map(s=>`<button type="button" class="${(o?o.statut:'attente')===s[0]?'on':''}" data-s="${s[0]}" onclick="pickStatut(this)">${s[1]}</button>`).join('')}
        </div>
      </div>
      <button class="btn-primary" type="submit">Enregistrer la commande</button>
      ${o?`<button type="button" class="btn-danger" onclick="delOrder('${o.id}')">Supprimer cette commande</button>`:''}
    </form>
  `;
}
function pickStatut(btn){ document.querySelectorAll('#statutSeg button').forEach(b=>b.classList.remove('on')); btn.classList.add('on'); }
function updateReste(){
  const p = parseFloat(document.getElementById('of_prix').value)||0;
  const a = parseFloat(document.getElementById('of_avance').value)||0;
  document.getElementById('resteVal').textContent = fmt(Math.max(0,p-a)) + ' FCFA';
}
function saveOrder(ev){
  ev.preventDefault();
  const statutBtn = document.querySelector('#statutSeg button.on');
  const data = {
    clientId: document.getElementById('of_client').value,
    modeleId: document.getElementById('of_modele').value || null,
    dateCommande: document.getElementById('of_dateC').value,
    dateLivraison: document.getElementById('of_dateL').value,
    prix: parseFloat(document.getElementById('of_prix').value)||0,
    avance: parseFloat(document.getElementById('of_avance').value)||0,
    statut: statutBtn ? statutBtn.dataset.s : 'attente',
  };
  const photo = document.getElementById('orderPhotoPick').dataset.photo;
  if(photo) data.photo = photo;
  if(state.editId){
    const idx = DB.commandes.findIndex(x=>x.id===state.editId);
    DB.commandes[idx] = {...DB.commandes[idx], ...data};
  } else {
    DB.commandes.push({id:uid(), ...data});
  }
  save(); toast('Commande enregistrée'); state.view='list'; state.editId=null; state.newForClient=null; render();
  return false;
}
function delOrder(id){
  if(!confirm('Supprimer cette commande ?')) return;
  DB.commandes = DB.commandes.filter(o=>o.id!==id);
  save(); toast('Commande supprimée'); state.view='list'; render();
}

/* ---------- MODÈLES ---------- */
function renderModeles(){
  if(state.view==='form') return renderModeleForm();
  if(state.view==='detail') return renderModeleDetail(state.editId);
  setHeader('Modèles');
  setFab(`<button class="fab" onclick="state.view='form'; state.editId=null; render();">${ICON_ADD} Ajouter</button>`);
  const f = state.modeleFilter || 'toutes';
  let list = DB.modeles.slice().reverse();
  if(f!=='toutes') list = list.filter(m=>m.categorie===f);
  let chips = `<div class="filter-chips">
    <button class="${f==='toutes'?'on':''}" onclick="state.modeleFilter='toutes'; renderModeles();">Toutes</button>
    <button class="${f==='Homme'?'on':''}" onclick="state.modeleFilter='Homme'; renderModeles();">Homme</button>
    <button class="${f==='Femme'?'on':''}" onclick="state.modeleFilter='Femme'; renderModeles();">Femme</button>
    <button class="${f==='Enfant'?'on':''}" onclick="state.modeleFilter='Enfant'; renderModeles();">Enfant</button>
  </div>`;
  let html = chips;
  if(list.length===0){
    html += `<div class="empty"><div class="ic">👕</div><p>Aucun modèle pour le moment.</p></div>`;
  } else {
    html += '<div class="model-grid">' + list.map(m=>`
      <div class="model-card" onclick="state.view='detail'; state.editId='${m.id}'; render();">
        <div class="ph">${m.photo?`<img src="${m.photo}">`:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3l4 3 4-3 3 4-3 2v11H5V9L2 7l3-4"/></svg>'}</div>
        <div class="info"><div class="mn">${esc(m.nom)}</div><div class="mc">${m.categorie}</div></div>
      </div>
    `).join('') + '</div>';
  }
  document.getElementById('main').innerHTML = html;
}
function renderModeleForm(){
  const m = state.editId ? DB.modeles.find(x=>x.id===state.editId) : null;
  setHeader(m?'Modifier le modèle':'Nouveau modèle', "state.view='list'; render();");
  setFab('');
  document.getElementById('main').innerHTML = `
    <form onsubmit="return saveModele(event)">
      <div class="photo-pick" id="modPhotoPick" onclick="document.getElementById('modPhotoInput').click()">
        ${m&&m.photo?`<img src="${m.photo}">`:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="4"/></svg><span>Ajouter une photo du modèle</span>`}
      </div>
      <input type="file" id="modPhotoInput" accept="image/*" style="display:none" onchange="pickPhoto(this,'modPhotoPick')">
      <div class="field"><label>Nom du modèle</label><input type="text" id="mo_nom" value="${m?esc(m.nom):''}" placeholder="Ex : Boubou brodé" required></div>
      <div class="field"><label>Catégorie</label>
        <div class="seg" id="catSeg">
          ${['Homme','Femme','Enfant'].map(c=>`<button type="button" class="${(m?m.categorie:'Homme')===c?'on':''}" data-c="${c}" onclick="pickStatut(this)">${c}</button>`).join('')}
        </div>
      </div>
      <div class="field"><label>Description / notes</label><textarea id="mo_desc">${m&&m.desc?esc(m.desc):''}</textarea></div>
      <button class="btn-primary" type="submit">Enregistrer le modèle</button>
      ${m?`<button type="button" class="btn-danger" onclick="delModele('${m.id}')">Supprimer ce modèle</button>`:''}
    </form>
  `;
}
function saveModele(ev){
  ev.preventDefault();
  const catBtn = document.querySelector('#catSeg button.on');
  const nom = document.getElementById('mo_nom').value.trim();
  if(!nom) return false;
  const data = { nom, categorie: catBtn?catBtn.dataset.c:'Homme', desc: document.getElementById('mo_desc').value.trim() };
  const photo = document.getElementById('modPhotoPick').dataset.photo;
  if(photo) data.photo = photo;
  if(state.editId){
    const idx = DB.modeles.findIndex(x=>x.id===state.editId);
    DB.modeles[idx] = {...DB.modeles[idx], ...data};
  } else {
    DB.modeles.push({id:uid(), ...data});
  }
  save(); toast('Modèle enregistré'); state.view='list'; state.editId=null; render();
  return false;
}
function delModele(id){
  if(!confirm('Supprimer ce modèle ?')) return;
  DB.modeles = DB.modeles.filter(m=>m.id!==id);
  save(); toast('Modèle supprimé'); state.view='list'; render();
}
function renderModeleDetail(id){
  const m = DB.modeles.find(x=>x.id===id);
  if(!m){ state.view='list'; return render(); }
  setHeader('Modèle', "state.view='list'; render();");
  setFab('');
  document.getElementById('main').innerHTML = `
    <div class="detail-card">
      <div class="photo-pick" style="min-height:180px; cursor:default; border-style:solid;">${m.photo?`<img src="${m.photo}">`:'👕'}</div>
      <div style="margin-top:14px;">
        <div class="detail-head" style="align-items:flex-start">
          <div><div class="name">${esc(m.nom)}</div><div class="phone">${m.categorie}</div></div>
        </div>
        ${m.desc?`<p style="margin-top:10px; font-size:14.5px; color:var(--ink-soft); line-height:1.5;">${esc(m.desc)}</p>`:''}
      </div>
      <div class="action-row">
        <button class="btn-outline" onclick="state.view='form'; render();">Modifier</button>
        <button class="btn-danger" onclick="delModele('${m.id}')">Supprimer</button>
      </div>
    </div>
  `;
}

/* ---------- Démarrage ---------- */
render();
</script>
</body>
</html>
