<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon Atelier</title>
<style>
:root{
  --indigo:#1F3A5F; --indigo-dk:#152943; --gold:#D4A017; --gold-dk:#B4870F;
  --cream:#FBF7EF; --card:#FFFFFF; --ink:#1A1A1A; --ink-soft:#5B6472;
  --line:#E8E1D4; --green:#3A7D44; --coral:#C1502E; --blue-soft:#EDF2F8;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--cream); color:var(--ink); height:100%; display:flex; flex-direction:column; overflow:hidden;}
#app{display:flex; flex-direction:column; height:100%; max-width:480px; margin:0 auto; width:100%; position:relative;}
header{background:var(--indigo); color:#fff; padding:18px 20px 16px; padding-top:calc(18px + env(safe-area-inset-top,0px)); display:flex; align-items:center; gap:12px; flex-shrink:0;}
header .back{width:36px; height:36px; border-radius:10px; background:rgba(255,255,255,.14); display:flex; align-items:center; justify-content:center; font-size:20px; cursor:pointer; border:none; color:#fff; flex-shrink:0;}
header h1{font-size:20px; font-weight:700; flex:1;}
main{flex:1; overflow-y:auto; padding:16px 16px 90px; -webkit-overflow-scrolling:touch;}
.search{display:flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--line); border-radius:14px; padding:11px 14px; margin-bottom:14px;}
.search svg{width:19px; height:19px; color:var(--ink-soft); flex-shrink:0;}
.search input{border:none; outline:none; flex:1; font-size:15px; background:none; color:var(--ink);}
.fab{position:fixed; bottom:calc(22px + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%); background:var(--gold); color:#1A1A1A; border:none; border-radius:50%; width:64px; height:64px; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 20px rgba(212,160,23,.45); cursor:pointer; z-index:15;}
.fab:active{transform:translateX(-50%) scale(.94);}
.fab svg{width:28px; height:28px;}
.totals{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
.tot-card{background:var(--card); border-radius:16px; padding:14px; border:1px solid var(--line);}
.tot-card .n{font-size:19px; font-weight:800;}
.tot-card.given .n{color:var(--green);}
.tot-card.left .n{color:var(--coral);}
.tot-card .l{font-size:12px; color:var(--ink-soft); margin-top:2px; font-weight:600;}
.list-item{background:#fff; border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:10px; display:flex; gap:12px; align-items:center; cursor:pointer;}
.avatar{width:48px; height:48px; border-radius:12px; background:var(--blue-soft); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-weight:800; color:var(--indigo); font-size:17px; overflow:hidden;}
.avatar img{width:100%; height:100%; object-fit:cover;}
.li-body{flex:1; min-width:0;}
.li-title{font-weight:700; font-size:15.5px;}
.li-sub{font-size:13px; color:var(--ink-soft); margin-top:2px;}
.chev{color:var(--ink-soft); font-size:20px; flex-shrink:0;}
.badge{font-size:11px; font-weight:700; padding:4px 9px; border-radius:20px; flex-shrink:0;}
.badge.attente{background:#F3EAE0; color:var(--gold-dk);}
.badge.cours{background:var(--blue-soft); color:var(--indigo);}
.badge.termine{background:#E4F0E5; color:var(--green);}
.badge.livree{background:#EAEAEA; color:#555;}
.empty{text-align:center; padding:60px 20px; color:var(--ink-soft);}
.empty .ic{font-size:44px; margin-bottom:10px;}
.empty p{font-size:14.5px; line-height:1.5;}
.section-title{font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.5px; color:var(--ink-soft); margin:18px 0 10px;}
.section-title:first-child{margin-top:0;}
form{display:flex; flex-direction:column; gap:14px;}
.field label{display:block; font-size:13px; font-weight:700; color:var(--ink-soft); margin-bottom:6px;}
.field input,.field select,.field textarea{width:100%; border:1.5px solid var(--line); border-radius:12px; padding:13px 14px; font-size:15.5px; background:#fff; color:var(--ink); outline:none; font-family:inherit;}
.field textarea{resize:vertical; min-height:60px;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--indigo);}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.photo-pick{border:2px dashed var(--line); border-radius:16px; padding:16px; text-align:center; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:6px; color:var(--ink-soft); font-size:13.5px; font-weight:600; position:relative; overflow:hidden; min-height:80px; justify-content:center;}
.photo-pick img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
.photo-pick svg{width:24px; height:24px;}
.seg{display:flex; background:var(--blue-soft); border-radius:12px; padding:4px; gap:4px; flex-wrap:wrap;}
.seg button{flex:1; min-width:70px; border:none; background:none; padding:10px 4px; border-radius:9px; font-weight:700; font-size:13px; color:var(--ink-soft); cursor:pointer;}
.seg button.on{background:#fff; color:var(--indigo); box-shadow:0 1px 3px rgba(0,0,0,.08);}
.btn-primary{background:var(--indigo); color:#fff; border:none; border-radius:14px; padding:16px; font-size:16px; font-weight:800; cursor:pointer; margin-top:6px;}
.btn-primary:active{background:var(--indigo-dk);}
.btn-danger{background:none; color:var(--coral); border:1.5px solid #F0D9CF; border-radius:14px; padding:14px; font-size:14.5px; font-weight:700; cursor:pointer;}
.row-mini{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); font-size:14.5px;}
.row-mini .k{color:var(--ink-soft);}
.row-mini .v{font-weight:700;}
.meas-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px 16px;}
.mini-tag{font-size:11.5px; color:var(--ink-soft); font-weight:700; margin:14px 0 8px;}
.toast{position:fixed; bottom:calc(30px + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:12px 20px; border-radius:30px; font-size:14px; font-weight:600; z-index:40; opacity:0; transition:opacity .25s; pointer-events:none; white-space:nowrap;}
.toast.show{opacity:1;}
</style>
</head>
<body>
<div id="app">
  <header id="hdr"><h1 id="hdrTitle">PRO-TAILLEUR</h1></header>
  <main id="main"></main>
  <div id="fabSlot"></div>
</div>
<div style="text-align:center; padding:6px 0 2px; font-size:10.5px; color:var(--ink-soft); opacity:.55; letter-spacing:.3px;">@MPB Group</div>
<div class="toast" id="toast"></div>
<script>
const KEY='atelier_simple_v1';
function load(){ try{return JSON.parse(localStorage.getItem(KEY))||{fiches:[]};}catch(e){return {fiches:[]};} }
function save(){ try{localStorage.setItem(KEY, JSON.stringify(DB));}catch(e){ toast("Stockage plein — supprimez une photo."); } }
let DB = load();
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1800); }
function fmt(n){ return (Math.round(n||0)).toLocaleString('fr-FR'); }
function initials(n){ return (n||'?').trim().split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function esc(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function pickPhoto(input, targetId){
  const f=input.files[0]; if(!f) return;
  const reader=new FileReader();
  reader.onload=()=>{ document.getElementById(targetId).innerHTML=`<img src="${reader.result}">`; document.getElementById(targetId).dataset.photo=reader.result; };
  reader.readAsDataURL(f);
}
let state = { view:'list', editId:null, q:'' };
function setHeader(title, back){ document.getElementById('hdr').innerHTML = (back?'<button class="back" onclick="'+back+'">‹</button>':'') + '<h1 id="hdrTitle">'+title+'</h1>'; }
function setFab(html){ document.getElementById('fabSlot').innerHTML = html||''; }

const ICON_ADD='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>';
const ICON_SEARCH='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3" stroke-linecap="round"/></svg>';
const STATUTS = [['attente','En attente'],['cours','En cours'],['termine','Terminée'],['livree','Livrée']];
function statutLabel(s){ return (STATUTS.find(x=>x[0]===s)||['','—'])[1]; }
const MEAS_GROUPS = [
  ['Haut du corps', [['tourCou','Tour de cou'],['carrure','Carrure (dos)'],['epaule','Long. épaule'],['poitrine','Tour de poitrine'],['tourTaille','Tour de taille'],['tourBassin','Tour de bassin']]],
  ['Bras', [['longueurManche','Long. manche'],['tourBras','Tour de bras'],['tourPoignet','Tour de poignet']]],
  ['Bas du corps', [['longueurTenue','Long. tenue (boubou/robe)'],['longueurPantalon','Long. pantalon'],['tourCuisse','Tour de cuisse'],['tourGenou','Tour de genou']]],
];
const MEAS_FIELDS = MEAS_GROUPS.flatMap(g=>g[1]);

function render(){
  if(state.view==='form') return renderForm();
  setHeader('PRO-TAILLEUR'); setFab(`<button class="fab" onclick="state.view='form'; state.editId=null; render();">${ICON_ADD}</button>`);
  const q=(state.q||'').toLowerCase();
  let list = DB.fiches.filter(f=> !q || f.nom.toLowerCase().includes(q) || (f.modele||'').toLowerCase().includes(q));
  const totalDonne = DB.fiches.reduce((s,f)=> s + (f.avance||0), 0);
  const totalReste = DB.fiches.reduce((s,f)=> s + Math.max(0,(f.prix||0)-(f.avance||0)), 0);
  let html = `<div class="totals">
    <div class="tot-card given"><div class="n">${fmt(totalDonne)} FCFA</div><div class="l">Montant donné</div></div>
    <div class="tot-card left"><div class="n">${fmt(totalReste)} FCFA</div><div class="l">Montant reste</div></div>
  </div>`;
  html += `<div class="search">${ICON_SEARCH}<input placeholder="Rechercher un client ou un modèle..." value="${state.q||''}" oninput="state.q=this.value; render();"></div>`;
  if(list.length===0){
    html += `<div class="empty"><div class="ic">🧵</div><p>${DB.fiches.length? "Aucun résultat." : "Aucune fiche pour le moment.<br>Appuyez sur « Nouvelle fiche » pour commencer."}</p></div>`;
  } else {
    list.slice().reverse().forEach(f=>{
      const reste = Math.max(0,(f.prix||0)-(f.avance||0));
      html += `<div class="list-item" onclick="state.view='form'; state.editId='${f.id}'; render();">
        <div class="avatar">${f.photo?`<img src="${f.photo}">`:initials(f.nom)}</div>
        <div class="li-body"><div class="li-title">${esc(f.nom)}</div><div class="li-sub">${f.modele?esc(f.modele)+' · ':''}${reste>0?'Reste '+fmt(reste)+' FCFA':'Soldé'}</div></div>
        <div class="badge ${f.statut||'attente'}">${statutLabel(f.statut||'attente')}</div>
      </div>`;
    });
  }
  document.getElementById('main').innerHTML = html;
}

function renderForm(){
  const f = state.editId ? DB.fiches.find(x=>x.id===state.editId) : null;
  setHeader(f?'Modifier la fiche':'Nouvelle fiche', "state.view='list'; render();");
  setFab('');
  const measHtml = MEAS_GROUPS.map(g=>`
    <div class="mini-tag">${g[0]}</div>
    <div class="meas-grid">${g[1].map(m=>`
      <div class="field"><label>${m[1]} (cm)</label><input type="number" step="0.5" min="0" id="mf_${m[0]}" value="${f&&f[m[0]]?f[m[0]]:''}"></div>
    `).join('')}</div>
  `).join('');
  const fReste = f ? Math.max(0,(f.prix||0)-(f.avance||0)) : 0;
  const totalsHtml = f ? `<div class="totals">
    <div class="tot-card given"><div class="n">${fmt(f.avance||0)} FCFA</div><div class="l">Montant donné</div></div>
    <div class="tot-card left"><div class="n">${fmt(fReste)} FCFA</div><div class="l">Montant reste</div></div>
  </div>` : '';
  document.getElementById('main').innerHTML = `
    ${totalsHtml}
    <form onsubmit="return saveFiche(event)">
      <div class="photo-pick" id="photoPick" onclick="document.getElementById('photoInput').click()">
        ${f&&f.photo?`<img src="${f.photo}">`:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="4"/></svg><span>Photo (optionnel)</span>`}
      </div>
      <input type="file" id="photoInput" accept="image/*" style="display:none" onchange="pickPhoto(this,'photoPick')">

      <div class="section-title">Client</div>
      <div class="field"><label>Nom et prénom</label><input type="text" id="f_nom" value="${f?esc(f.nom):''}" placeholder="Ex : Awa Diop" required></div>
      <div class="field"><label>Téléphone</label><input type="tel" id="f_tel" value="${f?f.tel||'':''}" placeholder="Ex : 77 123 45 67"></div>

      <div class="section-title">Modèle</div>
      <div class="field"><label>Nom du modèle</label><input type="text" id="f_modele" value="${f?esc(f.modele||''):''}" placeholder="Ex : Boubou brodé"></div>

      <div class="section-title">Mesures</div>
      ${measHtml}

      <div class="section-title">Versement</div>
      <div class="grid2">
        <div class="field"><label>Prix total (FCFA)</label><input type="number" min="0" id="f_prix" value="${f?f.prix||'':''}" oninput="updateReste()"></div>
        <div class="field"><label>Avance versée (FCFA)</label><input type="number" min="0" id="f_avance" value="${f?f.avance||'':''}" oninput="updateReste()"></div>
      </div>
      <div class="row-mini" style="background:var(--blue-soft); border-radius:12px; padding:12px 14px; border:none;">
        <span class="k">Reste à payer</span><span class="v" id="resteVal">${fmt((f?f.prix||0:0)-(f?f.avance||0:0))} FCFA</span>
      </div>
      <div class="field"><label>Statut</label>
        <div class="seg" id="statutSeg">
          ${STATUTS.map(s=>`<button type="button" class="${(f?f.statut:'attente')===s[0]?'on':''}" data-s="${s[0]}" onclick="pickStatut(this)">${s[1]}</button>`).join('')}
        </div>
      </div>

      <button class="btn-primary" type="submit">Enregistrer la fiche</button>
      ${f?`<button type="button" class="btn-danger" onclick="delFiche('${f.id}')">Supprimer cette fiche</button>`:''}
    </form>
  `;
}
function pickStatut(btn){ document.querySelectorAll('#statutSeg button').forEach(b=>b.classList.remove('on')); btn.classList.add('on'); }
function updateReste(){
  const p = parseFloat(document.getElementById('f_prix').value)||0;
  const a = parseFloat(document.getElementById('f_avance').value)||0;
  document.getElementById('resteVal').textContent = fmt(Math.max(0,p-a)) + ' FCFA';
}
function saveFiche(ev){
  ev.preventDefault();
  const nom = document.getElementById('f_nom').value.trim();
  if(!nom) return false;
  const statutBtn = document.querySelector('#statutSeg button.on');
  const data = {
    nom,
    tel: document.getElementById('f_tel').value.trim(),
    modele: document.getElementById('f_modele').value.trim(),
    prix: parseFloat(document.getElementById('f_prix').value)||0,
    avance: parseFloat(document.getElementById('f_avance').value)||0,
    statut: statutBtn ? statutBtn.dataset.s : 'attente',
  };
  MEAS_FIELDS.forEach(m=>{ const v=document.getElementById('mf_'+m[0]).value; if(v) data[m[0]]=v; else delete data[m[0]]; });
  const photo = document.getElementById('photoPick').dataset.photo;
  if(photo) data.photo = photo;
  if(state.editId){
    const idx = DB.fiches.findIndex(x=>x.id===state.editId);
    DB.fiches[idx] = {...DB.fiches[idx], ...data};
  } else {
    DB.fiches.push({id:uid(), ...data});
  }
  save(); toast('Fiche enregistrée'); state.view='list'; state.editId=null; render();
  return false;
}
function delFiche(id){
  if(!confirm('Supprimer cette fiche ?')) return;
  DB.fiches = DB.fiches.filter(f=>f.id!==id);
  save(); toast('Fiche supprimée'); state.view='list'; render();
}

render();
</script>
</body>
</html>
